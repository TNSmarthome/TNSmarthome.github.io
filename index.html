<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách sản phẩm TN Smarthome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 20px auto;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .product img {
      width: 100%;
      border-radius: 10px;
    }
    .product h2 {
      font-size: 20px;
      color: #2c3e50;
    }
    .product p {
      margin: 5px 0;
    }
    .buy-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #27ae60;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }
    .buy-btn:hover {
      background-color: #2ecc71;
    }
  </style>
</head>
<body>

  <h1>Sản phẩm TN Smarthome</h1>

  <div class="product">
    <img src="https://via.placeholder.com/300x200" alt="Khóa cửa thông minh">
    <h2>Khóa cửa thông minh TN01</h2>
    <p>Giá: 3.500.000đ</p>
    <a href="#" class="buy-btn">Mua ngay</a>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300x200" alt="Công tắc cảm ứng">
    <h2>Công tắc cảm ứng TN02</h2>
    <p>Giá: 750.000đ</p>
    <a href="#" class="buy-btn">Mua ngay</a>
  </div>

</body>
</html>
